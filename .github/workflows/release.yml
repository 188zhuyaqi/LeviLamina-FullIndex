name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: FullIndex-*
          merge-multiple: false
          path: artifacts

      - name: Package
        run: |
          cd artifacts
          zip -r ../FullIndex-plugin-${{ github.ref_name }}.zip FullIndex-plugin-*
          zip -r ../FullIndex-web-${{ github.ref_name }}.zip FullIndex-web-*

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            FullIndex-plugin-${{ github.ref_name }}.zip
            FullIndex-web-${{ github.ref_name }}.zip
